name: crafty_bay
description: "Customer app for crafty bay users"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.11.0
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.3
  flutter_svg: ^2.3.0
  intl: ^0.20.2
  provider: ^6.1.5+1
  shared_preferences: ^2.5.5
  email_validator: ^3.0.0
  pin_code_fields: ^9.4.0
  carousel_slider: ^5.1.2
  http: ^1.6.0
  logger: ^2.7.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
